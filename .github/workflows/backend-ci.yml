name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/**'
      - 'infra/**'
      - '.github/workflows/**'
      - '.gitleaks.toml'
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'infra/**'
      - '.github/workflows/**'
      - '.gitleaks.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  backend-test:
    name: Backend Test and DB Verification
    needs: security-scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eiu_pdds_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant execution permission for Maven wrapper
        run: chmod +x server/mvnw

      - name: Run unit and integration tests
        working-directory: server
        run: ./mvnw clean test -B

      - name: Validate Flyway database migrations
        working-directory: server
        run: >-
          ./mvnw flyway:migrate -B
          -Dflyway.url=jdbc:postgresql://localhost:5432/eiu_pdds_test
          -Dflyway.user=test_user
          -Dflyway.password=test_password
          -Dflyway.locations=classpath:db/migration

  docker-build-check:
    name: Docker Build Verification
    needs: backend-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: eiu-pdds-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
