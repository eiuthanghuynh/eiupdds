name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/**'
      - 'infra/**'
      - '.github/**'
      - '.gitleaks.toml'
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'infra/**'
      - '.github/**'
      - '.gitleaks.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  migration-lint:
    name: Flyway Migration Lint & Immutability Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Validate Flyway migration naming, versions, and immutability
        run: bash .github/scripts/validate-migrations.sh

  backend-test:
    name: Backend Test and DB Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eiu_pdds_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Ensure Maven wrapper execution permissions
        run: chmod +x server/mvnw

      - name: Run unit and integration tests
        working-directory: server
        run: ./mvnw clean test -B

      - name: Validate Flyway database migrations
        working-directory: server
        run: >-
          ./mvnw flyway:migrate -B
          -Dflyway.url=jdbc:postgresql://localhost:5432/eiu_pdds_test
          -Dflyway.user=test_user
          -Dflyway.password=test_password
          -Dflyway.locations=classpath:db/migration

  docker-compose-smoke-test:
    name: Docker Compose Runtime Verification
    needs: [migration-lint, backend-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build production backend image with GHA cache
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: server
          file: server/Dockerfile
          load: true
          tags: infra-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker Compose runtime smoke test
        env:
          SKIP_PROD_BUILD: "1"
        run: bash .github/scripts/docker-smoke-test.sh
