name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/**'
      - 'infra/**'
      - '.github/**'
      - '.gitleaks.toml'
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'infra/**'
      - '.github/**'
      - '.gitleaks.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  migration-lint:
    name: Flyway Migration Lint & Immutability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Flyway migration naming, versions, and immutability
        run: bash .github/scripts/validate-migrations.sh

  backend-test:
    name: Backend Test and DB Verification
    needs: [security-scan, migration-lint]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eiu_pdds_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Ensure Maven wrapper jar and execution permissions
        run: |
          chmod +x server/mvnw
          if [ ! -f server/.mvn/wrapper/maven-wrapper.jar ]; then
            mkdir -p server/.mvn/wrapper
            curl -fsSL -o server/.mvn/wrapper/maven-wrapper.jar https://repo.maven.apache.org/maven2/org/apache/maven/wrapper/maven-wrapper/3.3.2/maven-wrapper-3.3.2.jar
          fi

      - name: Run unit and integration tests
        working-directory: server
        run: ./mvnw clean test -B

      - name: Validate Flyway database migrations
        working-directory: server
        run: >-
          ./mvnw flyway:migrate -B
          -Dflyway.url=jdbc:postgresql://localhost:5432/eiu_pdds_test
          -Dflyway.user=test_user
          -Dflyway.password=test_password
          -Dflyway.locations=classpath:db/migration

  docker-compose-smoke-test:
    name: Docker Compose Runtime Verification
    needs: backend-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Docker Compose runtime smoke test
        run: bash .github/scripts/docker-smoke-test.sh
