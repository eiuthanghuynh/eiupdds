services:
  postgres:
    image: postgres:16-alpine
    container_name: eiu-pdds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eiu_pdds_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-eiu_pdds_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eiu-pdds-network

  redis:
    image: redis:7-alpine
    container_name: eiu-pdds-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eiu-pdds-network

  minio:
    image: docker.io/pgsty/silo:latest
    container_name: eiu-pdds-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eiu-pdds-network

  minio-init:
    image: docker.io/pgsty/mc:latest
    container_name: eiu-pdds-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set mysilo http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb --ignore-existing mysilo/${MINIO_BUCKET_NAME:-eiu-pdds-plants};
      mc anonymous set download mysilo/${MINIO_BUCKET_NAME:-eiu-pdds-plants};
      echo 'SILO bucket ${MINIO_BUCKET_NAME:-eiu-pdds-plants} initialized with public read access.';
      exit 0;
      "
    networks:
      - eiu-pdds-network

  backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: eiu-pdds-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SERVER_PORT: 8080
      POSTGRES_DB: ${POSTGRES_DB:-eiu_pdds_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_PORT: 5432
      DB_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_API_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-eiu-pdds-plants}
      ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY:-}
    env_file:
      - ../.env
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - eiu-pdds-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  eiu-pdds-network:
    driver: bridge

