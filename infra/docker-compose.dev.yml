# ==============================================================================
# Docker Compose Development Overlay for EIU PDDS (Hot-Reload Enabled)
# Usage: docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up -d --build
# ==============================================================================
services:
  backend:
    build:
      context: ../server
      dockerfile: Dockerfile.dev
    container_name: eiu-pdds-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-eiu_pdds_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_NAME: eiu-pdds-plants
    env_file:
      - ../.env
    ports:
      - "8080:8080"
    stdin_open: true
    tty: true
    volumes:
      # Live volume bind mounts: any changes in src/ or pom.xml reflect immediately
      - ../server/src:/app/src
      - ../server/pom.xml:/app/pom.xml
      - ../.env:/app/.env:ro
      - maven_dev_cache:/root/.m2
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - eiu-pdds-network

volumes:
  maven_dev_cache:
