server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: pdds-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Java 21 Virtual Threads (Project Loom)
  threads:
    virtual:
      enabled: true

  # Multipart Ingestion Configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 20MB

  # Spring Boot DevTools Hot-Reload (Dual ClassLoader fast restart)
  devtools:
    restart:
      enabled: true
      poll-interval: 2000ms
      quiet-period: 1000ms
      exclude:
        - "META-INF/maven/**"
        - "META-INF/resources/**"
        - "static/**"
        - "public/**"
        - "templates/**"
        - "db/migration/**"
        - "**/*Test.class"
        - "**/*Tests.class"
    livereload:
      enabled: false

  # Springdoc / Swagger OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Actuator Observability Probes
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

# Cloud & AI Integration Config
roboflow:
  api-key: ${ROBOFLOW_API_KEY}
  workspace: ${ROBOFLOW_WORKSPACE:plant-disease-detection-mztfb}
  workflow-id: ${ROBOFLOW_WORKFLOW_ID:7BrZ3OIi8ZsxxlqKtKm1}
  model-id: ${ROBOFLOW_MODEL_ID:plant-leaf-diseases/10}
  serverless-url: ${ROBOFLOW_SERVERLESS_URL:https://serverless.roboflow.com}
  timeout-seconds: ${ROBOFLOW_TIMEOUT_SECONDS:15}
  confidence-threshold: ${ROBOFLOW_CONFIDENCE_THRESHOLD:0.4}

# Object Storage (MinIO / S3) Config
storage:
  provider: minio
  minio:
    endpoint: ${MINIO_ENDPOINT:http://${MINIO_HOST:localhost}:${MINIO_API_PORT:${MINIO_PORT:9000}}}
    public-url: ${MINIO_PUBLIC_URL:http://${MINIO_PUBLIC_HOST:localhost}:${MINIO_API_PORT:${MINIO_PORT:9000}}}
    access-key: ${MINIO_ROOT_USER:${MINIO_ACCESS_KEY:minioadmin}}
    secret-key: ${MINIO_ROOT_PASSWORD:${MINIO_SECRET_KEY:minioadmin123}}
    bucket-name: ${MINIO_BUCKET_NAME:eiu-pdds-plants}
    region: ${MINIO_REGION:us-east-1}

# JWT Authentication & Token Lifecycle Config (Enterprise Dual-Token)
jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:eiu-pdds-auth}
  audience: ${JWT_AUDIENCE:eiu-pdds-client}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000} # 15 minutes
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

# OAuth2 3rd-Party Providers
security:
  oauth2:
    google:
      client-ids: ${GOOGLE_CLIENT_IDS:${GOOGLE_CLIENT_ID:eiu-pdds-mobile.apps.googleusercontent.com}}

