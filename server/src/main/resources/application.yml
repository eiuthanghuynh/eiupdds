server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: pdds-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # Java 21 Virtual Threads (Project Loom)
  threads:
    virtual:
      enabled: true

  # Multipart Ingestion Configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 20MB

  # Springdoc / Swagger OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Actuator Observability Probes
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

# Cloud & AI Integration Config
roboflow:
  api-key: ${ROBOFLOW_API_KEY:}
  workspace: plant-disease-detection-mztfb
  workflow-id: ${ROBOFLOW_WORKFLOW_ID:7BrZ3OIi8ZsxxlqKtKm1}
  model-id: plant-leaf-diseases/10
  serverless-url: https://serverless.roboflow.com
  timeout-seconds: 15
  confidence-threshold: 0.4

# Object Storage (MinIO / S3) Config
storage:
  provider: minio
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin123}
    bucket-name: ${MINIO_BUCKET_NAME:eiu-pdds-plants}
    region: ${MINIO_REGION:us-east-1}

