spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:${DB_PORT:5432}}/${POSTGRES_DB:${DB_NAME:eiu_pdds_db}}
    username: ${POSTGRES_USER:${DB_USER:postgres}}
    password: ${POSTGRES_PASSWORD:${DB_PASSWORD:postgres123}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

storage:
  provider: minio
  minio:
    endpoint: ${MINIO_ENDPOINT:http://${MINIO_HOST:localhost}:${MINIO_API_PORT:${MINIO_PORT:9000}}}
    public-url: ${MINIO_PUBLIC_URL:http://${MINIO_PUBLIC_HOST:localhost}:${MINIO_API_PORT:${MINIO_PORT:9000}}}
    access-key: ${MINIO_ROOT_USER:${MINIO_ACCESS_KEY:minioadmin}}
    secret-key: ${MINIO_ROOT_PASSWORD:${MINIO_SECRET_KEY:minioadmin123}}
    bucket-name: ${MINIO_BUCKET_NAME:eiu-pdds-plants}
